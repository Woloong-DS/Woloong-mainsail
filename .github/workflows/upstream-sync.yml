# ============================================================================
# upstream-sync —— 吸收上游官方新版 → 重放 woloong 定制 → 门禁 → 发布（D20 发行树）
#
# 自动闭环：
#   · 每周定时审计（check-upstream）→ 落后才继续（"落后"只回答上游有没有新版）
#   · 重叠加（fork-sync：上游树替换 → 重放定制 → 应用 remove.list → 更新 upstream.json）
#   · 门禁：定制资产完整性 + 构建产物含定制（不过则不发布）
#   · 构建：npm ci + vite build；dist 作为 Release 资产（不进 git）
#   · 已发布性审计：本仓库是否真的为 base_ref 建过 Release 且含 mainsail.zip
#     —— 否则"上游没有新版"≠"我们没东西可做"，需要走「仅补发布」路径
#   · 三种结局：落后→重叠加+构建+发布 / 未落后但未发布→仅构建+补发布 / 已发布→结束
#   · 发布：tag = 上游 tag 原文（与上游版本一一对应）；推送 main 与 tag
#   · 通知下游：若有 WOLOONG_DISPATCH_TOKEN 则 repository_dispatch 通知 Woloong-OS 跟进
#   · 漂移/失败：自动开 Issue（去重），绝不静默遗漏
# ============================================================================
name: upstream-sync

on:
  schedule:
    - cron: '23 3 * * 1'      # 每周一：审计上游新发布
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游 ref（留空=审计得到的最新）'
        required: false
        default: ''
        type: string
      next_tag:
        description: '本次发布 tag（留空=直接使用上游 tag（与上游版本一一对应 ✓））'
        required: false
        default: ''
        type: string
      do_push:
        description: '是否推送与发布（false=只演练）'
        required: false
        default: true
        type: boolean
      force_rebuild:
        description: '强制重建并重新发布（即使上游无新版本；用于修复打包/元数据）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  restack:
    runs-on: ubuntu-24.04   # 显式固定：ubuntu-latest 自 2026-10-19 起滚动迁移到 26.04（actions/runner-images#14748）
    steps:
      - name: 检出
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 配置 git 身份
        run: |
          git config user.name  'woloong-ci'
          git config user.email 'ci@woloong.local'
          git config core.autocrlf false

      - name: 添加上游远端并抓取
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/mainsail-crew/mainsail.git || true
          git fetch upstream --tags --prune --force || git fetch upstream --tags --prune --force || true

      - name: 上游版本审计（逐版本列出，不漏）
        id: audit
        run: |
          set +e
          bash woloong-release/tools/check-upstream.sh | tee /tmp/audit.txt
          rc=${PIPESTATUS[0]}
          set -e
          LATEST=$(grep '^上游最新' /tmp/audit.txt | awk '{print $NF}')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "0" ]; then echo 'behind=0' >> "$GITHUB_OUTPUT"; else echo 'behind=1' >> "$GITHUB_OUTPUT"; fi

      - name: 发布状态审计（本仓库是否真的发布过该版本）
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          BASE=$(python3 -c "import json;print(json.load(open('woloong-release/upstream.json',encoding='utf-8'))['base_ref'])")
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          NAMES=$(gh release view "$BASE" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
          if printf '%s\n' "$NAMES" | grep -qx 'mainsail.zip'; then
            echo 'published=1' >> "$GITHUB_OUTPUT"
            echo "发布状态: $BASE 已有 Release 且含 mainsail.zip ✓"
          else
            echo 'published=0' >> "$GITHUB_OUTPUT"
            ASSETS=$(printf '%s' "${NAMES:-无}" | tr '\n' ',' | sed 's/,$//')
            echo "::warning::$BASE 尚无 Release 资产 mainsail.zip（现有资产: $ASSETS）→ 本次需要补发布"
          fi

      - name: 决策（重叠加 / 仅补发布 / 结束）
        id: gate
        run: |
          set -uo pipefail
          BEHIND='${{ steps.audit.outputs.behind }}'
          PUB='${{ steps.published.outputs.published }}'
          FORCE='${{ inputs.force_rebuild }}'
          RESTACK=0; if [ "$BEHIND" != "0" ] || [ "$FORCE" = "true" ]; then RESTACK=1; fi
          PUBLISH=0; if [ "$RESTACK" = "1" ] || [ "$PUB" != "1" ]; then PUBLISH=1; fi
          echo "restack=$RESTACK" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "决策: behind=$BEHIND published=$PUB force=$FORCE → restack=$RESTACK publish=$PUBLISH"

      - name: 已是最新且已发布 → 结束
        if: steps.gate.outputs.publish == '0'
        run: echo '上游无新版本，且本仓库该版本的 Release 资产已存在 —— 无需动作 ✓'

      - name: 重叠加（上游树替换 → 重放定制 → remove.list → 更新基线声明）
        id: restack
        if: steps.gate.outputs.restack == '1'
        run: |
          set -uo pipefail
          REF='${{ inputs.upstream_ref }}'; [ -n "$REF" ] || REF='${{ steps.audit.outputs.latest }}'
          TAG='${{ inputs.next_tag }}';  [ -n "$TAG" ] || TAG="$REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "重叠加目标：上游 $REF → 我们的 tag $TAG"
          bash woloong-release/tools/fork-sync.sh . --upstream-ref "$REF" --tag "$TAG"

      - name: 门禁 —— 定制资产完整性
        if: steps.gate.outputs.publish == '1'
        run: bash woloong-release/tools/verify-assets.sh

      - name: 构建（npm ci + vite build）
        if: steps.gate.outputs.publish == '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          du -sh dist; ls dist | head

      - name: 门禁 —— 定制是否进入构建产物
        if: steps.gate.outputs.publish == '1'
        run: |
          set -euo pipefail
          N=$(grep -rl 'woloongforge' dist/assets 2>/dev/null | wc -l)
          echo "产物中提及 woloongforge 的文件数: $N"
          [ "$N" -gt 0 ] || { echo '::error::构建产物中未发现 woloong 定制主题，拒绝发布'; exit 1; }

      - name: 解析发布 tag（重叠加优先，其次基线版本）
        id: tag
        if: steps.gate.outputs.publish == '1'
        run: |
          set -uo pipefail
          TAG='${{ inputs.next_tag }}'
          [ -n "$TAG" ] || TAG='${{ steps.restack.outputs.tag }}'
          [ -n "$TAG" ] || TAG='${{ steps.published.outputs.base }}'
          [ -n "$TAG" ] || { echo '::error::无法确定发布 tag（缺 next_tag / restack / base_ref）'; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "发布 tag = $TAG"

      - name: 打包 Release 资产（dist 不进 git）
        id: pack
        if: steps.gate.outputs.publish == '1'
        run: |
          set -euo pipefail
          TAG='${{ steps.tag.outputs.tag }}'
          # 固定资产名 mainsail.zip：Moonraker 的 zip 更新器按 release_info.json 的 asset_name 精确匹配；
          # 同时把 asset_name 写进包内 release_info.json（版本仍取自 release 的 tag_name）。
          python3 - "$TAG" <<'PY'
          import json, pathlib, sys
          tag = sys.argv[1]
          p = pathlib.Path("dist/release_info.json")
          d = json.loads(p.read_text(encoding='utf-8')) if p.is_file() else {}
          d['version'] = tag
          d['asset_name'] = 'mainsail.zip'
          d['project_owner'] = 'Woloong-DS'
          d['project_name'] = 'Woloong-mainsail'
          p.write_text(json.dumps(d, ensure_ascii=False) + '\n', encoding='utf-8')
          print('release_info.json ->', d)
          PY
          # 先打固定名（保证它是第一个资产），再打带版本名的副本便于人工/审计
          ( cd dist && zip -qr "mainsail.zip" . )
          cp "dist/mainsail.zip" "dist/mainsail-dist-$TAG.zip"
          ls -lh "dist/mainsail.zip" "dist/mainsail-dist-$TAG.zip"
          echo "asset=dist/mainsail.zip" >> "$GITHUB_OUTPUT"
          echo "asset_versioned=dist/mainsail-dist-$TAG.zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "dist/mainsail.zip" | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: 发布（推送 main + tag + Release 资产）
        if: steps.gate.outputs.publish == '1' && inputs.do_push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ steps.tag.outputs.tag }}'
          # ★ 以"本次是否真的产生了新提交"为准，而不是"是否跑了重叠加"：
          #   force_rebuild 触发时重叠加会跑，但幂等检查可能判定无变化（HEAD 未动）——
          #   这时不应推送 main，更不应 git tag -f 移动已有 tag ✗
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            git push origin HEAD:main
            git tag -f "$TAG" >/dev/null 2>&1 || true
            git push -f origin "$TAG"
            echo "已推送 main 与 tag $TAG"
          else
            echo "本次未产生新提交（重叠加幂等 / 仅补发布）→ 不推送 main、不移动 tag $TAG，只更新 Release 资产"
          fi
          gh release view "$TAG" --repo Woloong-DS/Woloong-mainsail >/dev/null 2>&1 || gh release create "$TAG" --repo Woloong-DS/Woloong-mainsail --title "mainsail $TAG" --notes "上游基线 ${{ steps.published.outputs.base }} + woloong 定制"
          gh release upload "$TAG" --repo Woloong-DS/Woloong-mainsail '${{ steps.pack.outputs.asset }}' --clobber
          gh release upload "$TAG" --repo Woloong-DS/Woloong-mainsail '${{ steps.pack.outputs.asset_versioned }}' --clobber 2>/dev/null || true
          echo "已发布 Release $TAG（资产 mainsail-dist-$TAG.zip）"

      - name: 通知 Woloong-OS 跟进（把 sha/资产信息一并带过去，下游无需跨仓库权限）
        id: notify
        continue-on-error: true   # 通知是尽力而为 ✓ 失败不得掩盖同步成功 ✗
        if: steps.gate.outputs.publish == '1' && inputs.do_push
        env:
          TOKEN: ${{ secrets.WOLOONG_DISPATCH_TOKEN }}
        run: |
          set -uo pipefail
          TAG='${{ steps.tag.outputs.tag }}'
          SHA=$(git rev-parse HEAD)
          ASSET_PATH='${{ steps.pack.outputs.asset }}'
          ASSET="$(basename "$ASSET_PATH")"   # ★ 下游按资产名精确匹配：必须是 mainsail.zip，不能是 dist/mainsail.zip
          ASHA='${{ steps.pack.outputs.sha256 }}'
          if [ -z "$TOKEN" ]; then
            echo "::notice::未配置 WOLOONG_DISPATCH_TOKEN —— 请手动在 Woloong-OS 执行：bash tools/sync-component-release.sh mainsail $TAG"
            exit 0
          fi
          # 令牌预检：401=凭据本身无效（过期/撤销/写错）；404=凭据有效但看不到目标仓库（无权限/仓库名错）
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' https://api.github.com/repos/Woloong-DS/Woloong-OS || true)
          CODE=${CODE:-000}
          echo "预检：令牌访问 Woloong-DS/Woloong-OS 返回 HTTP $CODE"
          case "$CODE" in
            401) echo "::error::WOLOONG_DISPATCH_TOKEN 无效（401 Bad credentials）—— 已过期/被撤销/写错，请重新生成并更新 Secret"; echo "- ❌ 下游通知失败：令牌无效（401）" >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
            404) echo "::error::令牌有效但无权访问 Woloong-DS/Woloong-OS（404）—— 请授予该仓库 Contents: Read and write"; echo "- ❌ 下游通知失败：令牌无仓库权限（404）" >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
            000) echo "::error::预检请求失败（网络或 URL 异常）"; echo "- ❌ 下游通知失败：预检请求异常" >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac
          jq -n --arg c 'mainsail' --arg t "$TAG" --arg s "$SHA" --arg a "$ASSET" --arg h "$ASHA" \
            '{event_type:"component-released", client_payload:{component:$c, tag:$t, sha:$s, asset:$a, asset_sha256:$h}}' > /tmp/dispatch.json
          cat /tmp/dispatch.json
          if ! curl -fsSL -X POST -H "Authorization: Bearer $TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/Woloong-DS/Woloong-OS/dispatches --data-binary @/tmp/dispatch.json; then
            echo "::error::repository_dispatch 失败 —— Woloong-OS 未收到本次发布通知（Release 本身已发布成功）"
            echo "- ❌ 下游通知失败：repository_dispatch 非 2xx（Release 已发布）" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '已通知 Woloong-OS（携带 sha/资产信息）'
          echo "- ✅ 已通知 Woloong-OS：mainsail $TAG / $ASSET" >> "$GITHUB_STEP_SUMMARY"
      - name: 漂移或失败 → 开 Issue（不遗漏）
        continue-on-error: true   # 报警失败不得让整次 run 失败 ✗（实证 createIssue 403 ✗）
        # ★ 只用 failure() ✓：通知步骤已 continue-on-error ✓ 不会污染它 ✓
        #   （2026-10-18 实测：引用不存在的 step id 会导致报警**永不触发** ✗）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TITLE='上游发布待吸收（基线漂移，需人工重锚定）'
          BODY=$(printf '上游最新：%s\n\n审计输出：\n```\n%s\n```\n\n处理：更新 woloong-release/baseline/<path> 为新的**上游原版** → 工作区放**定制版** → tools/make-patch.sh → 更新 assets.manifest.tsv 中该文件的哈希 → 提交后重跑。\n' \
            '${{ steps.audit.outputs.latest }}' "$(tail -40 /tmp/audit.txt 2>/dev/null)")
          EXIST=$(gh issue list --state open --search "$TITLE" --json number -q '.[0].number' || true)
          if [ -n "$EXIST" ]; then gh issue comment "$EXIST" --body "$BODY" || echo "::warning::issue comment failed"; else gh issue create --title "$TITLE" --body "$BODY" || echo "::warning::issue create failed (手动记录: $TITLE)"; fi