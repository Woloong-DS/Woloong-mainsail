# ============================================================================
# upstream-sync —— 吸收上游官方新版，重放 woloong 定制，构建并发布（D20 发行树）
#
# 与 klipperscreen 同一套机制，差异：mainsail 是前端工程，必须**构建**（vite），
#   故本工作流额外：setup-node → npm ci → vite build → 校验产物含 woloongforge
#   → 打包 dist 为 Release 资产（dist 不进 git，作为资产发布 ✓）
#
# 不漏版本：weekly schedule 自动检测 + 差异审计逐版本列出 + 漂移自动开 Issue（去重）
# ============================================================================
name: upstream-sync

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游 ref（tag，例如 v2.19.0；留空=审计得到的最新）'
        required: false
        default: ''
        type: string
      next_tag:
        description: '本次发布的 tag（例如 woloong-1.1.0）'
        required: false
        default: ''
        type: string
      do_push:
        description: '是否推送与发布（false=只演练）'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  restack:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 配置 git 身份
        run: |
          git config user.name  'woloong-ci'
          git config user.email 'ci@woloong.local'
          git config core.autocrlf false

      - name: 添加上游远端并抓取
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/mainsail-crew/mainsail.git || true
          git fetch upstream --tags --prune

      - name: 上游版本审计（列出全部未吸收版本）
        id: audit
        run: |
          set +e
          bash woloong-release/tools/check-upstream.sh | tee /tmp/audit.txt
          rc=${PIPESTATUS[0]}
          set -e
          LATEST=$(grep '^上游最新' /tmp/audit.txt | awk '{print $NF}')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "0" ]; then echo 'behind=0' >> "$GITHUB_OUTPUT"; else echo 'behind=1' >> "$GITHUB_OUTPUT"; fi

      - name: 无新版本 → 结束
        if: steps.audit.outputs.behind == '0'
        run: echo '发行树已对应上游最新发布，无需动作 ✓'

      - name: 重叠加（上游树替换 → 重放定制 → 应用移除清单）
        if: steps.audit.outputs.behind != '0'
        run: |
          set -uo pipefail
          REF='${{ inputs.upstream_ref }}'; [ -n "$REF" ] || REF='${{ steps.audit.outputs.latest }}'
          ARGS=''; if [ -n '${{ inputs.next_tag }}' ]; then ARGS="--tag ${{ inputs.next_tag }}"; fi
          bash woloong-release/tools/fork-sync.sh . --upstream-ref "$REF" $ARGS

      - name: 门禁 —— 定制资产完整性
        if: steps.audit.outputs.behind != '0'
        run: bash woloong-release/tools/verify-assets.sh

      - name: 构建（npm ci + vite build）
        if: steps.audit.outputs.behind != '0'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          echo '--- dist 概览 ---'; du -sh dist; ls dist | head

      - name: 门禁 —— 定制是否进入构建产物
        if: steps.audit.outputs.behind != '0'
        run: |
          set -euo pipefail
          N=$(grep -rl 'woloongforge' dist/assets 2>/dev/null | wc -l)
          echo "产物中提及 woloongforge 的文件数: $N"
          [ "$N" -gt 0 ] || { echo '::error::构建产物中未发现 woloong 定制主题，拒绝发布'; exit 1; }
          ls dist/img/themes | head -10

      - name: 打包 Release 资产
        if: steps.audit.outputs.behind != '0'
        run: |
          set -euo pipefail
          TAG='${{ inputs.next_tag }}'; [ -n "$TAG" ] || TAG='woloong-1.1.0'
          ( cd dist && zip -qr "mainsail-dist-$TAG.zip" . )
          ls -lh "dist/mainsail-dist-$TAG.zip"
          echo "asset=dist/mainsail-dist-$TAG.zip" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        id: pack

      - name: 发布（tag + Release 资产）
        if: steps.audit.outputs.behind != '0' && inputs.do_push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ steps.pack.outputs.tag }}'
          git push origin HEAD:main
          git tag -f "$TAG" >/dev/null 2>&1 || true
          git push -f origin "$TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "mainsail $TAG" --notes "上游 ${{ steps.audit.outputs.latest }} + woloong 定制（woloongforge 主题）"
          gh release upload "$TAG" '${{ steps.pack.outputs.asset }}' --clobber
          echo "已发布 $TAG"

      - name: 漂移或失败 → 开 Issue（不遗漏）
        if: failure() && steps.audit.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TITLE='上游发布待吸收（基线漂移，需人工重锚定）'
          BODY=$(printf '上游最新：%s\n\n审计输出：\n```\n%s\n```\n\n处理：更新 woloong-release/baseline/<path> 为新的上游文件（注意：baseline 放**上游原版**，工作区放**定制版**）→ tools/make-patch.sh → 更新 assets.manifest.tsv 中该文件的哈希 → 提交后重跑。\n' \
            '${{ steps.audit.outputs.latest }}' "$(tail -40 /tmp/audit.txt 2>/dev/null)")
          EXIST=$(gh issue list --state open --search "$TITLE" --json number -q '.[0].number' || true)
          if [ -n "$EXIST" ]; then gh issue comment "$EXIST" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi

